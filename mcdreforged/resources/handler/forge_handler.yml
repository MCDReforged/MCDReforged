name: forge_handler

control:
  stop:
    command: stop
  send_message:
    builtin: minecraft_tellraw
  broadcast_message:
    builtin: minecraft_tellraw
    target: '@a'

parsing:
  pre_parse: []
  line_transforms:
    - builtin: strip_ansi_color
    - builtin: strip_minecraft_color
  line:
    # [18:26:03] [Server thread/INFO] [FML]: Unloading dimension 1
    # [18:29:30] [Server thread/INFO] [minecraft/DedicatedServer]: <Steve> tests
    # [09:00:00] [Server thread/INFO]: <Steve> Hello   (vanilla format, in some old forge servers e.g. forge 1.7.10)
    - '\[(?P<hour>\d+):(?P<min>\d+):(?P<sec>\d+)] \[(?P<thread>[^]]+)/(?P<logging>[^]/]+)]( \[[^]]+])?: (?P<content>.*)'
  player_message:
    # [Not Secure] <Steve> hello
    - '(\[Not Secure] )?<(?P<name>[^>]+)> (?P<message>.*)'
  player_name: '[a-zA-Z0-9_]{3,16}'

events:
  player_joined:
    # Steve[/127.0.0.1:9864] logged in with entity id 131 at (187.2703, 146.79014, 404.84718)
    # Steve[/[2001:db8:85a3::8a2e:370:7334]:9864] logged in with entity id 131 at (187.2703, 146.79014, 404.84718)
    # Steve[local] logged in with entity id 131 at (187.2703, 146.79014, 404.84718)
    # Steve[IP hidden] logged in with entity id 131 at (187.2703, 146.79014, 404.84718)
    - '(?P<name>[^\[]+)\[(.*?)] logged in with entity id \d+ at \(.+\)'
  player_left:
    # Steve left the game
    # System chat: Steve left the game   (mc >= 26.3 snapshot 3)
    - '(System chat: )?(?P<name>[^ ]+) left the game'
  server_version:
    # Starting minecraft server version 1.21.4
    - 'Starting minecraft server version (?P<version>.+)'
  server_address:
    # Starting Minecraft server on *:25565
    - 'Starting Minecraft server on (?P<ip>\S+):(?P<port>\d+)'
  server_startup_done:
    # Done (3.500s)! For help, type "help"            (mc >= 1.13)
    # Done (3.500s)! For help, type "help" or "?"     (mc < 1.13)
    - 'Done \([0-9.]+s\)! For help, type "help"( or "\?")?'
  rcon_started:
    # RCON running on 0.0.0.0:25575
    - 'RCON running on [\w.]+:\d+'
  server_stopping:
    # Stopping server
    - 'Stopping server'
